<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
	<h:head>
		<!-- CSS -->
        <link rel="stylesheet" type="text/css" media="screen" href="../assets/css/style.css" />
        <link rel="stylesheet" type="text/css" media="screen" href="../assets/css/color.css" />
        <link rel="shortcut icon" type="image/x-icon" href="../assets/favicon/favicon.ico"/>
		<h:outputStylesheet name="styles.css" />

		<title>CO2-Emission aller Länder</title>
	</h:head>
	<h:body>
		<div id="wrapper">
		<!-- Header & Logo -->
		<header>
			<img src="../assets/img/Logo.png" width="200px"/>
			<br/><br/><h1 class="c_darkgreen">CO2-Emission aller Länder</h1>
			<br/><hr/><br/><br/>
		</header>
		<main>
			<h:form>
				<p:card style="width: 30em">
					<f:facet name="title">Login</f:facet>
		
					<p:panelGrid>
						<p:row>
							<p:outputLabel value="Accountname: " for="name" />
							<!-- Eventquelle -->
							<p:inputText id="name" value="#{loginController.account.name}"
								size="25">
								<!-- Eventobjekt: Event wird von Komponente ausgelöst, wenn die Vlidierung abgeschlossen ist -->
								<!-- Event-Listener-Methode zum Login-Controller -->
								<!-- Accountname zwischenspeichern, damit Kombination mit Passwort validiert werden kann -->
								<f:event type="jakarta.faces.event.PostValidateEvent"
									listener="#{loginController.postValidateName}" />
							</p:inputText>
						</p:row>
						<br/>
						<p:row>
							<p:outputLabel value="Passwort: " for="pass" />
							<!-- selbst definierte Login-Validierung -->
							<p:password id="pass" value="#{loginController.account.passwort}"
								required="true" validator="#{loginController.validateLogin}"
								size="25" />
						</p:row>
					</p:panelGrid>
		
					<f:facet name="footer">
						<!-- Controller-Methode für spezifische Weiterleitung, wird nur aufgerufen, wenn Validierung erfolgreich war -->
						<p:commandButton value="Login" action="#{loginController.login}" />
						<p:messages>
							<p:autoUpdate />
						</p:messages>
					</f:facet>
		
				</p:card>
			</h:form>
		</main>
		<footer>
		<br/><br/><hr/><br/>
			<ul>
	          	<li>© Stephanie Ott (4237273) 2024</li>
	          	<li><a href="#" >Datenschutzerklärung</a></li>
	          	<li><a href="#" >Impressum</a></li>
				<li><a href="#" target="_blank"><img src="../assets/img/instagram.png" class="footericon"/>CO2-Instagram</a></li>
			</ul>
		</footer> 
		</div>
	</h:body>
</html>
