<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
	<h:head>
		<title>CO2-Emission Vorschau</title>
		<h:outputStylesheet name="styles.css" />
	</h:head>
	<h:body>
		<!-- Header & Logo -->
		<img src="assets/img/Logo.png" width="200px"/>
		<h1>CO2-Emission: Vorschaumodus</h1>
		
		<!-- Tabelle für CO2-Emissionen der Länder -->
		
		<!-- neue Zeile hinzufügen -->
		
		<!-- landemission.emisson muss eine Collection sein (Liste von co2emission-Objekten) -->
		<h:form>
		<h:dataTable var="co2emission" value="#{co2app.landemission}" styleClass="co2tabelle">
			<h:column>
				<f:facet name="header">
					<h:outputText value="Land"></h:outputText>
				</f:facet>
				<h:outputText value="#{co2emission.land}"></h:outputText>
			</h:column>
			<h:column>
                <f:facet name="header">
                    <h:outputText value="Flagge"></h:outputText>
                </f:facet>
                <h:outputText value="#{co2emission.flagge}"></h:outputText>
            </h:column>
            
            <h:column>
                <f:facet name="header">
                    <h:outputText value="Emission 2020 (in Tonnen)"></h:outputText>
                </f:facet>
                <h:outputText value="#{co2emission.emission2020}"></h:outputText>
            </h:column>

            <h:column>
                <f:facet name="header">
                    <h:outputText value="Emission 2021 (in Tonnen)"></h:outputText>
                </f:facet>
                <h:outputText value="#{co2emission.emission2021}"></h:outputText>
            </h:column>

            <h:column>
                <f:facet name="header">
                    <h:outputText value="Emission 2022 (in Tonnen)"></h:outputText>
                </f:facet>
                <h:outputText value="#{co2emission.emission2022}" ></h:outputText>
            </h:column>

            <h:column>
                <f:facet name="header">
                    <h:outputText value="Emission 2023 (in Tonnen)"></h:outputText>
                </f:facet>
                <h:outputText value="#{co2emission.emission2023}"></h:outputText>
            </h:column>
	
        </h:dataTable>
        	<h:commandLink value="⚙️ bearbeiten" action="#{controller.startEdit()}"/>
        </h:form>
	</h:body>
</html>
