<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
	<h:head>
		<!-- CSS -->
        <link rel="stylesheet" href="assets/css/style.css"/>
        <link rel="stylesheet" href="assets/css/color.css"/>
        <link rel="shortcut icon" type="image/x-icon" href="assets/favicon/favicon.ico"/>
		<h:outputStylesheet name="styles.css" />

		<title>CO2-Emission Bearbeitung</title>
	</h:head>
	<h:body>
		<div id="wrapper">
		<!-- Header & Logo -->
		<header>
			<img src="assets/img/Logo.png" width="200px"/>
			<br/><br/><h1 class="c_darkgreen">CO2-Emission: Bearbeitungsmodus</h1>
			<br/><hr/><br/><br/>
		</header>
		<main>
			<!-- Tabelle für CO2-Emissionen der Länder -->
		
			<!-- neue Zeile hinzufügen -->
		
			<!-- landemission.emisson muss eine Collection sein (Liste von co2emission-Objekten) -->
			<h:form>
			<h:dataTable var="co2emission" value="#{co2app.landemission}" styleClass="co2tabelle">
				<h:column>
					<f:facet name="header">
						<h:inputText value="Land"></h:inputText>
					</f:facet>
					<h:inputText value="#{co2emission.land}"></h:inputText>
				</h:column>
				<h:column>
	                <f:facet name="header">
	                    <h:inputText value="Flagge"></h:inputText>
	                </f:facet>
	                <h:inputText value="#{co2emission.flagge}"></h:inputText>
	            </h:column>
	            
	            <h:column>
	                <f:facet name="header">
	                    <h:inputText value="Emission 2020 (in Tonnen)"></h:inputText>
	                </f:facet>
	                <h:inputText value="#{co2emission.emission2020}"></h:inputText>
	            </h:column>
	
	            <h:column>
	                <f:facet name="header">
	                    <h:inputText value="Emission 2021 (in Tonnen)"></h:inputText>
	                </f:facet>
	                <h:inputText value="#{co2emission.emission2021}"></h:inputText>
	            </h:column>
	
	            <h:column>
	                <f:facet name="header">
	                    <h:inputText value="Emission 2022 (in Tonnen)"></h:inputText>
	                </f:facet>
	                <h:inputText value="#{co2emission.emission2022}" ></h:inputText>
	            </h:column>
	
	            <h:column>
	                <f:facet name="header">
	                    <h:inputText value="Emission 2023 (in Tonnen)"></h:inputText>
	                </f:facet>
	                <h:inputText value="#{co2emission.emission2023}"></h:inputText>
	            </h:column>
	            
	            <h:column>
	                <f:facet name="header">
	                    <h:inputText value="Löschen"></h:inputText>
	                </f:facet>
	                <h:commandLink value="❌" action="#{controller.löschen()}"/>
	            </h:column>
		
	        </h:dataTable>
	        	<h:commandLink value="✅ speichern" action="#{controller.stopEdit()}"/>
	        </h:form>
		</main>
		<footer>
		<br/><br/><hr/><br/>
			<ul>
	          	<li>© Stephanie Ott (4237273) 2024</li>
	          	<li><a href="#" >Datenschutzerklärung</a></li>
	          	<li><a href="#" >Impressum</a></li>
				<li><a href="#" target="_blank"><img src="assets/img/instagram.png" class="footericon"/>CO2-Instagram</a></li>
			</ul>
		</footer> 
		</div>
	</h:body>
</html>
