<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
	<h:head>
		<!-- CSS -->
        <link rel="stylesheet" type="text/css" media="screen" href="../assets/css/style.css" />
        <link rel="stylesheet" type="text/css" media="screen" href="../assets/css/color.css" />
        <link rel="shortcut icon" type="image/x-icon" href="../assets/favicon/favicon.ico"/>
		<h:outputStylesheet name="styles.css" />

		<title>CO2-Emission aller Länder</title>
	</h:head>
	<h:body>
		<div id="wrapper">
		<!-- Header & Logo -->
		<header>
			<img src="../assets/img/Logo.png" width="200px"/>
			<br/><br/><h1 class="c_darkgreen">CO2-Emission aller Länder</h1>
			<br/><hr/><br/><br/>
		</header>
		<main>
			<!-- Tabelle für CO2-Emissionen der Länder -->
			<!-- landemission.emisson muss eine Collection sein (Liste von co2emission-Objekten) -->
			<h:dataTable var="co2emission" value="#{co2app.landemission}" styleClass="co2tabelle">
				<h:column>
					<f:facet name="header">
						<h:outputText value="Land"></h:outputText>
					</f:facet>
					<h:outputText value="#{co2emission.land}"></h:outputText>
				</h:column>
				<h:column>
	                <f:facet name="header">
	                    <h:outputText value="Flagge"></h:outputText>
	                </f:facet>
	                <h:outputText value="#{co2emission.flagge}"></h:outputText>
	            </h:column>
	            
	            <h:column>
	                <f:facet name="header">
	                    <h:outputText value="Emission 2020 (in Tonnen)"></h:outputText>
	                </f:facet>
	                <h:outputText value="#{co2emission.emission2020}"></h:outputText>
	            </h:column>
	
	            <h:column>
	                <f:facet name="header">
	                    <h:outputText value="Emission 2021 (in Tonnen)"></h:outputText>
	                </f:facet>
	                <h:outputText value="#{co2emission.emission2021}"></h:outputText>
	            </h:column>
	
	            <h:column>
	                <f:facet name="header">
	                    <h:outputText value="Emission 2022 (in Tonnen)"></h:outputText>
	                </f:facet>
	                <h:outputText value="#{co2emission.emission2022}" ></h:outputText>
	            </h:column>
	
	            <h:column>
	                <f:facet name="header">
	                    <h:outputText value="Emission 2023 (in Tonnen)"></h:outputText>
	                </f:facet>
	                <h:outputText value="#{co2emission.emission2023}"></h:outputText>
	            </h:column>
	        </h:dataTable>
		</main>
		<footer>
		<br/><br/><hr/><br/>
			<ul>
	          	<li>© Stephanie Ott (4237273) 2024</li>
	          	<li><a href="#" >Datenschutzerklärung</a></li>
	          	<li><a href="#" >Impressum</a></li>
				<li><a href="#" target="_blank"><img src="../assets/img/instagram.png" class="footericon"/>CO2-Instagram</a></li>
			</ul>
		</footer> 
		</div>
	</h:body>
</html>
