<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<title>CO2-Emission</title>
	<!-- CSS -->
	<link rel="stylesheet" type="text/css" media="screen" href="color.css"/>
	<link rel="stylesheet" type="text/css" media="screen" href="styles.css"/>
	<link rel="shortcut icon" type="image/x-icon" href="/assets/favicon/favicon.ico"/>
</h:head>
<h:body>
	<!-- Header & Logo -->
	<header>
		<img src="assets/img/Logo.png" id="logo"/>
		<br/><br/><h1>Like Hero To Zero: CO2-Emission aller Länder</h1>
		<br/><hr/><br/><br/>
	</header>
       <!-- <input type="text" placeholder="Land suchen" class="form-control" id="searchLand" onkeyup="filterTable('searchLand')"/>
		<br/><br/>-->
		<p:dataTable var="emission" value="#{emissionTabelle.liste}" id="emissionstabel">
			<p:column headerText="Land">
				<p:outputLabel value="#{emission.land}" />
			</p:column>
			<p:column headerText="Landcode">
				<p:outputLabel value="#{emission.landCode}" />
			</p:column>
			<p:column headerText="CO2-Emissions (kt) 1990">
				<p:outputLabel value="#{emission.emission1990}" />
			</p:column>
			<p:column headerText="CO2-Emissions (kt) 2000">
				<p:outputLabel value="#{emission.emission2000}" />
			</p:column>
			<p:column headerText="CO2-Emissions (kt) 2010">
				<p:outputLabel value="#{emission.emission2010}" />
			</p:column>
			<p:column headerText="CO2-Emissions (kt) 2020">
				<p:outputLabel value="#{emission.emission2020}" />
			</p:column>
		</p:dataTable>
	<footer>
	<br/><br/><hr/><br/>
		<ul>
          	<li>© Stephanie Ott (4237273) 2024</li>
          	<li><a href="#" >Datenschutzerklärung</a></li>
          	<li><a href="#" >Impressum</a></li>
			<li><a href="https://www.instagram.com" target="_blank"><img src="assets/img/instagram.png" class="footericon"/>CO2-Instagram</a></li>
		</ul>
	</footer>
	<!-- JS -->
	<script src="tablefilter.js"></script>
</h:body>
</html>
